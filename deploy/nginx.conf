# /etc/nginx/sites-available/telefonlar
server {
    listen 80;
    server_name telefon.madaniyat.local;   # ichki DNS nomi yoki serverning IP manzili

    # Faqat xodimlar tarmog'i. MEHMON Wi-Fi tarmog'ini bu ro'yxatga QO'SHMANG:
    # aks holda begona odam hodimlarning mobil raqamlarini ko'ra oladi.
    # Quyidagi manzillar NAMUNA, aniq VLAN'larni AKT bo'limi bilan kelishing.
    allow 192.168.10.0/24;
    allow 127.0.0.1;
    deny all;

    root /opt/telefonlar/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Vite fayl nomiga xesh qo'shadi, shuning uchun uzoq keshlash xavfsiz.
    location /assets/ {
        expires 1y;
    }

    # Vue router: har qanday sahifa index.html'ni oladi. index.html keshlanmaydi,
    # yangi versiya chiqqanda brauzer darhol oladi.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
